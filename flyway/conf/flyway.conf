# Base Flyway configuration. Do NOT put tenant credentials here.

# Tenant URL is provided at runtime (Ansible): -url=...

# Migration scripts live in this repo
flyway.locations=filesystem:flyway/sql

# Reliability on flaky connections
flyway.connectRetries=10
flyway.connectRetriesInterval=5

# Default schema history table name (per-DB)
flyway.table=flyway_schema_history

# Reasonable safety defaults
flyway.validateOnMigrate=true

