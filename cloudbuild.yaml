steps:
  # ── Build image ──────────────────────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - me-central2-docker.pkg.dev/$PROJECT_ID/medicalcircle-dev/database-migration-automation:$COMMIT_SHA
      - -t
      - me-central2-docker.pkg.dev/$PROJECT_ID/medicalcircle-dev/database-migration-automation:latest
      - .

  # ── Push both tags ───────────────────────────────────────────────────────────
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - me-central2-docker.pkg.dev/$PROJECT_ID/medicalcircle-dev/database-migration-automation:$COMMIT_SHA
    waitFor: [build]

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - me-central2-docker.pkg.dev/$PROJECT_ID/medicalcircle-dev/database-migration-automation:latest
    waitFor: [build]

  # ── Deploy to Cloud Run ──────────────────────────────────────────────────────
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - database-migration-automation
      - --image=me-central2-docker.pkg.dev/$PROJECT_ID/medicalcircle-dev/database-migration-automation:$COMMIT_SHA
      - --region=me-central2
      - --platform=managed
      - --allow-unauthenticated
      - --ingress=all
      - --service-account=$_SERVICE_ACCOUNT
      - --timeout=3600
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      # Non-sensitive env vars only
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_MIGRATION_BUCKET=$_GCS_BUCKET,GCS_MIGRATION_PREFIX=migrations/
      # All discovery DB credentials pulled from Secret Manager (secrets named DB_HOST, DB_PORT, etc.)
      - --set-secrets=DISCOVERY_DB_HOST=DB_HOST:latest,DISCOVERY_DB_PORT=DB_PORT:latest,DISCOVERY_DB_USER=DB_USER:latest,DISCOVERY_DB_NAME=DB_NAME:latest,DISCOVERY_DB_PASSWORD=DB_PASSWORD:latest
    waitFor: [push-sha]

substitutions:
  _SERVICE_ACCOUNT: migration-sa@lively-synapse-400818.iam.gserviceaccount.com
  _GCS_BUCKET: database-migrations

images:
  - me-central2-docker.pkg.dev/$PROJECT_ID/medicalcircle-dev/database-migration-automation:$COMMIT_SHA
  - me-central2-docker.pkg.dev/$PROJECT_ID/medicalcircle-dev/database-migration-automation:latest

options:
  logging: CLOUD_LOGGING_ONLY
