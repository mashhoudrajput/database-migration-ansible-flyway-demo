steps:
  # ── Build image ──────────────────────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/db-migration-service:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/db-migration-service:latest
      - .

  # ── Push both tags ───────────────────────────────────────────────────────────
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/db-migration-service:$COMMIT_SHA]
    waitFor: [build]

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/db-migration-service:latest]
    waitFor: [build]

  # ── Deploy to Cloud Run ──────────────────────────────────────────────────────
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - db-migration-service
      - --image=gcr.io/$PROJECT_ID/db-migration-service:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --no-allow-unauthenticated      # internal only — callers need Bearer token
      - --ingress=internal              # not reachable from the public internet
      - --service-account=$_SERVICE_ACCOUNT
      - --timeout=3600                  # migrations can be slow
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      # Plain env vars (non-sensitive)
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_MIGRATION_BUCKET=$_GCS_BUCKET,GCS_MIGRATION_PREFIX=migrations/,DISCOVERY_DB_HOST=$_DISCOVERY_DB_HOST,DISCOVERY_DB_PORT=$_DISCOVERY_DB_PORT,DISCOVERY_DB_USER=$_DISCOVERY_DB_USER,DISCOVERY_DB_NAME=$_DISCOVERY_DB_NAME
      # Sensitive values from Secret Manager
      - --set-secrets=DISCOVERY_DB_PASSWORD=$_DISCOVERY_DB_PASSWORD_SECRET:latest
    waitFor: [push-sha]

substitutions:
  _REGION: us-central1
  _SERVICE_ACCOUNT: migration-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _GCS_BUCKET: my-migration-bucket
  _DISCOVERY_DB_HOST: 127.0.0.1
  _DISCOVERY_DB_PORT: "3306"
  _DISCOVERY_DB_USER: migration_user
  _DISCOVERY_DB_NAME: tenants_db
  _DISCOVERY_DB_PASSWORD_SECRET: discovery-db-password   # Secret Manager secret name

images:
  - gcr.io/$PROJECT_ID/db-migration-service:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/db-migration-service:latest

options:
  logging: CLOUD_LOGGING_ONLY
