steps:
  # ── Build image ──────────────────────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/db-migration-service:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/db-migration-service:latest
      - .

  # ── Push both tags ───────────────────────────────────────────────────────────
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/db-migration-service:$COMMIT_SHA]
    waitFor: [build]

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/db-migration-service:latest]
    waitFor: [build]

  # ── Deploy to Cloud Run ──────────────────────────────────────────────────────
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - db-migration-service
      - --image=gcr.io/$PROJECT_ID/db-migration-service:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --no-allow-unauthenticated      # internal only — callers need Bearer token
      - --ingress=internal              # not reachable from the public internet
      - --service-account=$_SERVICE_ACCOUNT
      - --timeout=3600                  # migrations can be slow
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      # Non-sensitive env vars only
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_MIGRATION_BUCKET=$_GCS_BUCKET,GCS_MIGRATION_PREFIX=migrations/
      # All discovery DB credentials pulled from Secret Manager (secrets named DB_HOST, DB_PORT, etc.)
      - --set-secrets=DISCOVERY_DB_HOST=DB_HOST:latest,DISCOVERY_DB_PORT=DB_PORT:latest,DISCOVERY_DB_USER=DB_USER:latest,DISCOVERY_DB_NAME=DB_NAME:latest,DISCOVERY_DB_PASSWORD=DB_PASSWORD:latest
    waitFor: [push-sha]

substitutions:
  _REGION: us-central1
  _SERVICE_ACCOUNT: migration-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _GCS_BUCKET: database-migrations

images:
  - gcr.io/$PROJECT_ID/db-migration-service:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/db-migration-service:latest

options:
  logging: CLOUD_LOGGING_ONLY
