name: Deploy DB Migration Service

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGION: me-central2
  SERVICE_NAME: database-migration-automation
  IMAGE: me-central2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/medicalcircle-dev/database-migration-automation

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Auth ──────────────────────────────────────────────────────────────
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker me-central2-docker.pkg.dev --quiet

      # ── Build & Push ───────────────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # ── Deploy ─────────────────────────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --ingress=all \
            --timeout=3600 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --network=${{ secrets.VPC_NETWORK }} \
            --subnet=${{ secrets.VPC_SUBNET }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars="GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCS_MIGRATION_BUCKET=database-migrations,GCS_MIGRATION_PREFIX=migrations/" \
            --set-secrets="DISCOVERY_DB_HOST=DB_HOST:latest,DISCOVERY_DB_PORT=DB_PORT:latest,DISCOVERY_DB_USER=DB_USER:latest,DISCOVERY_DB_NAME=DB_NAME:latest,DISCOVERY_DB_PASSWORD=DB_PASSWORD:latest"

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          echo "### Deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
